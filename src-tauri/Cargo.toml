[package]
name = "cyber-companion"
version = "0.5.3"
edition = "2021"
description = "A quiet desktop companion"

[lib]
name = "cyber_companion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "process", "io-util", "net"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pki-types = "1"
futures-util = "0.3"
eventsource-stream = "0.2"
url = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2-exception-helper = "0.1"
block = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3"] }
png = "0.17"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
