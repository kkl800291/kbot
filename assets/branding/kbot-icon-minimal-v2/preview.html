<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBOT · 图标 v2 对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edeef3;color:#28263a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1040px;margin:36px auto;padding:0 28px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}h1{font-size:24px;letter-spacing:-.5px;margin:0}header span{font-size:13px;color:#767389}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 3px 16px #28263a08}.title{padding:22px 24px 0;font-size:16px;font-weight:600}.title small{display:block;margin-top:7px;font-size:12px;font-weight:400;color:#827f91}.hero{height:276px;display:grid;place-items:center}.hero img{width:244px;height:244px}.sizes{display:flex;gap:30px;justify-content:center;align-items:flex-end;height:174px;padding:18px 12px 20px;border-top:1px solid #eeedf3}.sizes.dark{color:#c1bed5;background:#232231;border:0}.sample{display:flex;flex-direction:column;align-items:center;gap:9px}.sample img{display:block;object-fit:contain}.sample span{font-size:10px;color:#888497}.dark .sample span{color:#aaa5be}footer{font-size:12px;color:#888497;margin-top:18px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}header span{display:block;margin-top:10px}main{margin-top:24px}}
</style>
<main>
<header><h1>KBOT · 简化图标</h1><span>方案对照 · v2</span></header>
<div class="grid">
<section class="card">
<div class="title">A · 流动光球<small>保留光纹生命体的圆形与流动方向</small></div>
<div class="hero"><img src="orb.png" alt="浅底流动光球图标"></div>
<div class="sizes">
<div class="sample"><img src="orb.png" width="32" height="32" alt="光球 32px"><span>32px</span></div>
<div class="sample"><img src="orb.png" width="64" height="64" alt="光球 64px"><span>64px</span></div>
<div class="sample"><img src="orb.png" width="128" height="128" alt="光球 128px"><span>128px</span></div>
</div>
<div class="sizes dark">
<div class="sample"><img src="orb.png" width="32" height="32" alt="深背景光球 32px"><span>32px</span></div>
<div class="sample"><img src="orb.png" width="64" height="64" alt="深背景光球 64px"><span>64px</span></div>
<div class="sample"><img src="orb.png" width="128" height="128" alt="深背景光球 128px"><span>128px</span></div>
</div>
</section>
<section class="card">
<div class="title">B · K 标记<small>以圆润字形建立 KBOT 的品牌识别</small></div>
<div class="hero"><img src="monogram-k.png" alt="深底 K 标记图标"></div>
<div class="sizes">
<div class="sample"><img src="monogram-k.png" width="32" height="32" alt="K 32px"><span>32px</span></div>
<div class="sample"><img src="monogram-k.png" width="64" height="64" alt="K 64px"><span>64px</span></div>
<div class="sample"><img src="monogram-k.png" width="128" height="128" alt="K 128px"><span>128px</span></div>
</div>
<div class="sizes dark">
<div class="sample"><img src="monogram-k.png" width="32" height="32" alt="深背景 K 32px"><span>32px</span></div>
<div class="sample"><img src="monogram-k.png" width="64" height="64" alt="深背景 K 64px"><span>64px</span></div>
<div class="sample"><img src="monogram-k.png" width="128" height="128" alt="深背景 K 128px"><span>128px</span></div>
</div>
</section>
</div>
<footer>大图与实际小尺寸对照 · PNG 母版保留透明外角</footer>
</main>
</html>
