<!doctype html>
<html lang="zh-CN" class="theme-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBOT</title>
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
  <div id="menubar" hidden><button id="tray" aria-label="伙伴菜单"></button><span id="clock"></span></div>
  <div id="preview" hidden><b>KBOT</b><span>浏览器预览</span><button id="preview-summon">召唤</button><button id="preview-chat">对话窗口</button><button id="preview-settings">设置</button></div>
  <div id="standby" aria-hidden="true" inert></div>
  <div id="stage" data-s="hidden">
    <div id="halo" aria-hidden="true"></div>
    <div id="energy" aria-hidden="true"></div>
    <div id="topContent">
      <div class="t-bar" id="tBar" role="button" tabindex="0" aria-label="KBOT，召唤">
        <span class="t-label" id="tLabel"></span><span class="t-aux" id="tAux"></span>
      </div>
      <div class="t-note" id="tNote" role="alertdialog" aria-labelledby="tNoteTitle">
        <div class="n-title" id="tNoteTitle"></div>
        <div class="n-body" id="tNoteBody"></div>
        <div class="n-acts" id="tNoteActs"></div>
      </div>
      <section id="summon" inert aria-label="召唤 KBOT">
        <div class="s-field">
          <input id="sInput" type="text" autocomplete="off" spellcheck="false" aria-label="吩咐 KBOT">
          <button type="button" class="s-btn" id="sBtn" title="在窗口中继续（⌘↩）" aria-label="在窗口中继续" data-icon="expand"></button>
        </div>
        <div class="s-cap" id="sCap" aria-live="polite">
          <div class="s-cap-in">
            <div class="s-said" id="sSaid"></div>
            <div class="s-body">
              <div class="s-reply" id="sReply"></div>
              <button type="button" class="s-more" id="sMore">在窗口中查看全文 ›</button>
            </div>
            <div class="s-acts" id="sActs"></div>
          </div>
        </div>
      </section>
      <section id="panel" hidden inert aria-label="对话窗口">
        <header class="p-head">
          <div class="p-title">
            <div class="p-name">KBOT</div>
            <div class="p-sub" id="pSub"></div>
          </div>
          <div class="p-tools">
            <button class="ib" data-p="history" title="历史对话" data-icon="history"></button>
            <button class="ib" data-p="new" title="新对话" data-icon="plus"></button>
            <button class="ib" data-p="expand" title="放大" id="expandBtn" data-icon="expand"></button>
            <button class="ib" data-p="close" title="收起（Esc）" data-icon="minus"></button>
          </div>
        </header>
        <div class="p-history" id="history">
          <div class="h-search"><input type="text" placeholder="搜索对话"></div>
          <div class="h-list"></div>
        </div>
        <div class="p-body" id="messages"></div>
        <footer class="p-composer">
          <div class="att-row" id="attRow" hidden></div>
          <div class="hint" id="hint" hidden></div>
          <div class="input-wrap">
            <textarea id="input" rows="1"></textarea>
            <div class="toolbar">
              <button class="tb" data-t="image" title="添加图片（也可以粘贴或拖入）" data-icon="image"></button>
              <button class="tb" data-t="shot" title="截图提问" id="shotBtn" data-icon="shot" hidden></button>
              <button class="web-toggle" data-t="voice" id="voiceBtn" data-icon="speaker"><span>朗读</span></button>
              <button type="button" class="model-tag" id="modelTag" title="切换模型"></button>
              <span class="sp"></span>
              <button class="send" id="sendBtn" title="发送（Enter）"></button>
            </div>
          </div>
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/heic" multiple hidden>
        </footer>
        <div class="drop-overlay">松手即可发送</div>
      </section>
    </div>
  </div>

  <div id="menu" role="menu"></div>
  <div id="toast" role="status"></div>
  <div id="lightbox"><img alt="图片预览"></div>


  <script type="module" src="/src/main.ts"></script>
</body>
</html>
